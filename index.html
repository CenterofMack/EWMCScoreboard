<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://sky.blackbaudcdn.net; style-src 'self' 'unsafe-inline'; connect-src 'self' https://*.blackbaud.com https://*.blackbaudcloud.com https://*.powerplatform.com; img-src 'self' data:; frame-ancestors https://*.blackbaud.com https://*.blackbaudcloud.com https://*.blackbaudhosting.com;">
<title>EWMC smoke test</title>
<script src="https://sky.blackbaudcdn.net/static/sky-addin-client/1/sky-addin-client.umd.min.js"></script>
<style>
  body{font-family:system-ui,sans-serif;padding:24px;color:#1c2330;background:#f7f4ee;}
  pre{font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word;}
</style>
</head>
<body>
<pre id="out">Waiting for the Blackbaud host to load the tile…</pre>
<script>
(function () {
  var FLOW_URL = 'https://default3877db98b5154133ac939a6ce4072c.91.environment.api.powerplatform.com:443/powerautomate/automations/direct/cu/25/workflows/40df9f6fc9dd40eba3bff91166ae5d9a/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=lRV4iYjBKOtzb-9ZtI2j9E6b2vOlWGCz0KgjMVoKJFE';
  var out = document.getElementById('out');
  if (typeof BBSkyAddinClient === "undefined" || !BBSkyAddinClient.AddinClient) {
    out.textContent = "Not inside a Blackbaud host — this needs to be opened from inside RE NXT, not by visiting the page directly.";
    return;
  }
  var client = new BBSkyAddinClient.AddinClient({
    callbacks: {
      init: function (args) {
        args.ready({ showUI: true, title: "EWMC smoke test" });
        client.getUserIdentityToken().then(function (uit) {
          out.textContent = "Got a token (" + uit.length + " chars). Calling the flow…";
          fetch(FLOW_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: uit })
            .then(function (res) { return res.json(); })
            .then(function (data) {
              out.textContent = "round-trip OK: " + data.ok + "\nmy token was " + uit.length + " chars";
            })
            .catch(function (e) {
              out.textContent = "FETCH FAILED:\n" + e + "\n\nPress F12, click the Console tab, and copy the red line.";
            });
        });
      }
    },
    allowedOrigins: [
      /^https:\/\/[\w\-\.]+\.blackbaud\.com$/,
      /^https:\/\/[\w\-\.]+\.blackbaudcloud\.com$/,
      /^https:\/\/[\w\-\.]+\.blackbaudhosting\.com$/,
      /^https:\/\/[\w\-\.]+\.blackbaud\.dev$/
    ]
  });
})();
</script>
</body>
</html>
